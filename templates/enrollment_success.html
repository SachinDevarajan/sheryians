{% extends 'base.html' %}

{% block content %}

<section style="
    min-height: 80vh;
    background: #000;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
">

    <div style="
        text-align: center;
        max-width: 600px;
        padding: 40px;
    ">

        <h1 style="
            font-size: 48px;
            margin-bottom: 20px;
        ">
            Enrollment Successful 🎉
        </h1>

        <p style="
            color: #999;
            font-size: 18px;
            margin-bottom: 30px;
        ">

            You have successfully enrolled in

            <strong style="color:#48bd70;">
                {{ course.course_name }}
            </strong>

        </p>


        <a
            href="{% url 'my_courses' %}"
            style="
                display: inline-block;
                padding: 15px 30px;
                background: #38ad64;
                color: white;
                border-radius: 8px;
                text-decoration: none;
            "
        >
            Go to My Courses
        </a>

    </div>

</section>

{% endblock %}
